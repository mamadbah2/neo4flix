<!-- Hero Section with Slider -->
<section class="hero-section relative w-full h-[90vh] overflow-hidden flex items-center">
  
  <!-- Background Images Container -->
  <div class="absolute inset-0 z-0">
    @for (movie of movies(); track movie.tmdbId; let i = $index) {
      <div 
        class="hero-bg absolute inset-0 bg-cover bg-center transition-opacity duration-1000"
        [style.background-image]="'url(' + getBackdropUrl(movie.backdropPath) + ')'"
        [class.opacity-100]="i === currentIndex()"
        [class.opacity-0]="i !== currentIndex()">
      </div>
    }
    
    <!-- Loading placeholder -->
    @if (isLoading()) {
      <div class="absolute inset-0 bg-gray-900 animate-pulse"></div>
    }
  </div>
  
  <!-- Gradients for depth -->
  <div class="absolute inset-0 z-10 bg-gradient-to-r from-black via-transparent to-transparent opacity-90"></div>
  <div class="absolute inset-0 z-10 bg-gradient-to-t from-black via-black/10 to-transparent"></div>

  <!-- Content Area -->
  @if (currentMovie(); as movie) {
    <div class="relative z-20 px-6 md:px-16 max-w-4xl space-y-8">
      <!-- Tags -->
      <div class="flex items-center space-x-3">
        <span class="bg-[#E50914] text-white text-xs font-bold px-2 py-1 rounded">TOP 10</span>
        <span class="text-[#E50914] font-bold uppercase tracking-widest text-sm">Film tendance</span>
      </div>
      
      <!-- Title with animation -->
      <h2 
        class="text-5xl md:text-7xl font-black leading-tight drop-shadow-2xl transition-opacity duration-500"
        [class.opacity-100]="!isTransitioning()"
        [class.opacity-0]="isTransitioning()">
        {{ movie.title }}
      </h2>
      
      <!-- Overview with animation -->
      <p 
        class="text-lg md:text-xl text-gray-300 max-w-2xl line-clamp-3 transition-opacity duration-500"
        [class.opacity-100]="!isTransitioning()"
        [class.opacity-0]="isTransitioning()">
        {{ movie.overview }}
      </p>
      
      <!-- Action Buttons -->
      <div class="flex items-center space-x-4">
        <button 
          class="bg-white text-black px-8 py-3 rounded font-bold text-lg flex items-center gap-2 hover:bg-gray-200 transition"
          (click)="onPlayClick(movie)">
          <i class="fa-solid fa-play"></i>
          Lecture
        </button>
        
        <button 
          class="text-white px-8 py-3 rounded font-bold text-lg flex items-center gap-2 transition"
          [class.bg-gray-500/50]="!isInWatchlist(movie.tmdbId)"
          [class.hover:bg-gray-500/70]="!isInWatchlist(movie.tmdbId)"
          [class.bg-green-600/70]="isInWatchlist(movie.tmdbId)"
          [class.hover:bg-green-600/90]="isInWatchlist(movie.tmdbId)"
          (click)="onWatchlistClick(movie)">
          @if (isInWatchlist(movie.tmdbId)) {
            <i class="fa-solid fa-check"></i>
            Dans ma liste
          } @else {
            <i class="fa-solid fa-plus"></i>
            Ma liste
          }
        </button>
      </div>
    </div>
  }

  <!-- Slider Indicators -->
  <div class="absolute bottom-10 right-10 z-30 flex space-x-2">
    @for (movie of movies(); track movie.tmdbId; let i = $index) {
      <button 
        class="slider-dot w-3 h-3 rounded-full transition-all duration-300"
        [class.bg-white]="i === currentIndex()"
        [class.scale-125]="i === currentIndex()"
        [class.bg-gray-500]="i !== currentIndex()"
        (click)="goToSlide(i)"
        [attr.aria-label]="'Aller au film ' + (i + 1)">
      </button>
    }
  </div>
</section>

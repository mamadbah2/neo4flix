    <script>

                        "background-dark": "#000000",

                    animation: {
                        'fade-in': 'fadeIn 1s ease-out',

                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },

            top: -10%;

            filter: brightness(0.7);

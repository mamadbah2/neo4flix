server:
  port: 5050

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuration CORS globale pour le frontend Angular
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - Content-Type
            maxAge: 3600
      server:
        webflux:
          routes:
          - id: user-service
            uri: http://user-service:8081
            predicates:
              - Path=/api/users/**
          - id: movie-service
            uri: http://movie-service:8082
            predicates:
              - Path=/api/movies/**
          - id: recommendation-service
            uri: http://recommendation-service:8083
            predicates:
              - Path=/api/recommendations/**
          - id: rating-service
            uri: http://rating-service:8084
            predicates:
              - Path=/api/rates/**
          - id: test
            uri: http://httpbin.org
            predicates:
              - Path=/test/**
      
      # Activation du relais de token pour que le Gateway passe le JWT aux services
      default-filters:
        - TokenRelay

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak4flix.duckdns.org/realms/neo4flix
          jwk-set-uri: http://keycloak4flix.duckdns.org/realms/neo4flix/protocol/openid-connect/certs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
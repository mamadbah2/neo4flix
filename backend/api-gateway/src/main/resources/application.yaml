server:
  port: 5050

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: movie-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/movies/**
        - id: recommendation-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/recommendations/**
        - id: rating-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/rates/**
      
      # Activation du relais de token pour que le Gateway passe le JWT aux services
      default-filters:
        - TokenRelay

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak4flix.duckdns.org/realms/neo4flix
          jwk-set-uri: http://keycloak4flix.duckdns.org/realms/neo4flix/protocol/openid-connect/certs
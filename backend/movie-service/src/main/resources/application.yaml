# Configuration Feign
spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic

# Logging
logging:
  level:
    org.springframework.data.neo4j: DEBUG
    sn.dev.movie_service.clients: DEBUG

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always